<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Akıllı Kredi Operasyon Ajanı</title>
<style>
body{font-family:Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1f2d3d}
header{background:#1f3b57;color:#fff;padding:14px 24px;font-size:18px;font-weight:600}
main{max-width:980px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{font-size:15px;margin:0 0 12px;color:#1f3b57}
label{display:inline-block;min-width:150px;font-size:13px;color:#54657a}
input,select{width:220px;padding:6px;border:1px solid #c9d3de;border-radius:6px}
button{margin-top:10px;background:#1f3b57;color:#fff;border:0;padding:8px 18px;border-radius:6px;cursor:pointer}
button:hover{background:#2c5480}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #e6ebf1;text-align:left}
th{background:#eef2f7;color:#1f3b57}
.verdict{font-weight:600}
.ok{color:#1e7b34}.bad{color:#b3261e}
code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:12px}
#detail{margin-top:10px}
hr{border:0;border-top:1px solid #e6ebf1;margin:14px 0}
</style>
</head>
<body>
<header>Akıllı Kredi Operasyon Ajanı &mdash; Operasyon Paneli</header>
<main>
  <div class="card">
    <h2>Yeni Kredi Başvurusu</h2>
    <label>Ad Soyad</label><input id="name" value="Ali Yılmaz" /><br/>
    <label>T.C. Kimlik No</label><input id="tc" value="12345678901" /><br/>
    <label>Aylık Gelir (TRY)</label><input id="income" type="number" value="300000" /><br/>
    <label>Tutar (TRY)</label><input id="amount" type="number" value="100000" /><br/>
    <label>Vade (ay)</label><input id="term" type="number" value="36" /><br/>
    <button onclick="submitApp()">Başvuruyu Gönder</button>
    <span id="submitMsg"></span>
  </div>

  <div class="card">
    <h2>Başvurular</h2>
    <div id="stats" style="color:#54657a;font-size:13px;margin-bottom:10px"></div>
    <table>
      <thead><tr><th>ID</th><th>İsim</th><th>Durum</th><th>Önerilen Tutar</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card" id="detail" style="display:none"></div>
</main>
<script>
const API = "/api/v1";

async function api(method, url, body, isForm) {
  const opts = { method };
  if (body) {
    if (isForm) opts.body = body;
    else { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
  }
  const res = await fetch(url, opts);
  if (res.status === 404) return null;
  const json = await res.json();
  if (!res.ok) throw new Error(json.detail || res.status);
  return json;
}

async function submitApp() {
  const docCodes = ["IDENTITY","INCOME","EMPLOYMENT","ADDRESS","BANK_STATEMENT"];
  const payload = {
    name: document.getElementById("name").value, identity_no: tc.value,
    monthly_income: +income.value, requested_amount: +amount.value,
    requested_term_months: +term.value, submitted_documents: docCodes,
  };
  const rec = await api("POST", API + "/applications", payload);
  submitMsg.textContent = rec.status + " - " + rec.application_id;
  loadAll();
}

async function loadAll() {
  const list = await api("GET", API + "/applications");
  rows.innerHTML = "";
  const m = await api("GET", API + "/metrics");
  const n = await api("GET", API + "/notifications");
  stats.textContent = "Toplam: " + m.total_applications + " | Onaylı: " + m.approved_count
    + " | Bekleyen bildirim: " + n.pending;
  for (const rec of list.applications) {
    const amount = rec.result && rec.result.decision
      ? rec.result.decision.suggested_amount.toLocaleString("tr-TR") : "-";
    const tr = document.createElement("tr");
    tr.innerHTML = "<td><code>" + rec.application_id + "</code></td><td>"
      + rec.application.applicant.name + "</td><td class=\"verdict\">" + rec.status
      + "</td><td>" + amount + "</td><td><button onclick=\"showDetail('"
      + rec.application_id + "')\">Detay</button></td>";
    rows.appendChild(tr);
  }
}

async function showDetail(id) {
  const rec = await api("GET", API + "/applications/" + id);
  detail.style.display = "block";
  let html = "<h2>" + id + " - " + rec.application.applicant.name + "</h2>";
  html += "<div>Durum: <b>" + rec.status + "</b> &middot; Queue: <code>" + rec.queue_backend + "</code></div>";
  if (rec.result && rec.result.decision) {
    const d = rec.result.decision;
    html += "<p>Önerilen Kredi: <b>" + d.suggested_amount.toLocaleString("tr-TR")
      + " TRY</b> &middot; Vade: " + d.suggested_term_months + " ay</p>";
    html += "<a href=\"" + rec.result.report_pdf_path + "\" target=\"_blank\">PDF Rapor</a> &middot; "
      + "<a href=\"" + rec.result.report_json_path + "\" target=\"_blank\">JSON</a>";
    const sc = await api("GET", API + "/applications/" + id + "/scorecard");
    html += "<p>Kompozit Risk: <b>" + sc.grade + "</b> (" + sc.total_score + "/100)</p>";
    const au = await api("GET", API + "/applications/" + id + "/audit");
    html += "<p>Denetim kaydı: " + au.entries.length + " olay</p>";
    if (rec.status === "APPROVED") {
      const sch = await api("GET", API + "/applications/" + id + "/schedule");
      html += "<hr/><h2>Geri Ödeme Plan</h2><table><thead><tr><th>Ay</th><th>Bakiye</th><th>Faiz</th><th>Ana Para</th><th>Taksit</th></tr></thead><tbody>";
      for (const r of sch.rows.slice(0, 12)) {
        html += "<tr><td>" + r.period + "</td><td>" + Math.round(r.principal_balance).toLocaleString("tr-TR")
          + "</td><td>" + Math.round(r.interest).toLocaleString("tr-TR") + "</td><td>"
          + Math.round(r.principal_paid).toLocaleString("tr-TR") + "</td><td>"
          + Math.round(r.instalment).toLocaleString("tr-TR") + "</td></tr>";
      }
      html += "</tbody></table><div>Aylık taksit: " + Math.round(sch.instalment).toLocaleString("tr-TR")
        + " TRY &middot; Toplam: " + Math.round(sch.total_payment).toLocaleString("tr-TR") + " TRY</div>";
    }
  }
  html += "<hr/><h2>Belge Yükle</h2><select id=\"docCode\">"
    + "<option value=\"IDENTITY\">Kimlik</option><option value=\"INCOME\">Gelir</option>"
    + "<option value=\"EMPLOYMENT\">Çalışma</option><option value=\"ADDRESS\">İkametgah</option>"
    + "<option value=\"BANK_STATEMENT\">Banka Ekstresi</option></select>"
    + "<input type=\"file\" id=\"docFile\" /><br/>"
    + "<button onclick=\"uploadDoc('" + id + "')\">Yükle</button> "
    + "<button onclick=\"reprocess('" + id + "')\">Yeniden İşle</button>";
  detail.innerHTML = html;
}

async function uploadDoc(id) {
  const fd = new FormData();
  fd.append("code", docCode.value);
  fd.append("file", docFile.files[0]);
  const r = await api("POST", API + "/applications/" + id + "/documents", fd, true);
  showDetail(id);
}

async function reprocess(id) {
  await api("POST", API + "/applications/" + id + "/reprocess");
  showDetail(id);
}

loadAll();
</script>
