# Başvurana özel Türkçe gerekçe kodu sözlüğü. {placeholder} alanları karar
# bağlamındaki değerlerle (biçimlendirilmiş) doldurulur.
version: reasons_v2
codes:
  R01_DSR_YUKSEK: "Aylık borç ödemelerinizin gelirinize oranı {dsr} ile politika sınırı olan {max_dsr} seviyesinin üzerinde."
  R02_KKB_DUSUK: "Kredi Kayıt Bürosu kredi notunuz ({bureau_score}) başvurulan ürün için yeterli seviyede değil."
  R03_GECIKME_GECMISI: "Son 24 ayda kredi ödemelerinizde {delinquency_count_24m} kez gecikme kaydı bulunuyor."
  R04_SORGU_SAYISI: "Son 6 ayda adınıza yapılan kredi sorgu sayısı ({inquiries_6m}) yüksek."
  R05_ISTIHDAM_KISA: "Mevcut işyerinizdeki çalışma süreniz ({employment_months} ay) kısa."
  R06_GELIR_DEGISKEN: "Hesap hareketlerinizde aylık gelirinizin değişkenliği yüksek (değişkenlik katsayısı {income_cv})."
  R07_NEGATIF_BAKIYE: "Son 12 ayda hesabınız {negative_balance_days} gün eksi bakiyede kaldı."
  R08_KUMAR_HARCAMA: "Harcamalarınızın {gambling_share} kadarı şans oyunu/bahis işlemlerinden oluşuyor."
  R09_TUTAR_GELIR: "Talep edilen kredi tutarı gelirinize göre yüksek (yıllık gelirin {loan_to_income} katı)."
  R10_BELGE_UYUMSUZ: "Beyan ettiğiniz gelir ile belgelerinizde/hesap hareketlerinizde görülen gelir uyumlu değil."
  R11_SAHTECILIK_SUPHESI: "Yüklenen belgelerde ek doğrulama gerektiren tutarsızlıklar tespit edildi."
  R12_YAPTIRIM_ESLESME: "Kimlik bilgileriniz yasal tarama listeleriyle ek kontrol gerektiriyor."
  R13_YAS: "Başvuru yaş koşullarını (18 yaş ve vade sonunda en fazla 75 yaş) karşılamıyor."
  R14_TAKIPTE_KREDI: "Kredi Kayıt Bürosu kayıtlarında yasal takipte bir borcunuz bulunuyor."
  R15_HALKA_SUPHESI: "Başvurunuzdaki iletişim/hesap bilgileri başka başvurularla ortak kullanılıyor; ek doğrulama gerekiyor."
  R16_VELOCITY: "Son 30 gün içinde çok sayıda kredi başvurusu yapılmış."
  R17_TASARRUF_DUSUK: "Gelirinize göre aylık tasarruf oranınız düşük ({savings_rate})."
  R18_FAIZ_TAVANI: "Risk seviyenize uygun fiyat yasal azami faiz oranını aşıyor."
  R19_KARSILIKSIZ: "Son 12 ayda {nsf_count} adet karşılıksız/iade işlem kaydı bulunuyor."
  R20_INCE_DOSYA: "Kredi geçmişiniz sınırlı olduğu için değerlendirme hesap hareketlerinize dayanıyor."
  R21_KIMLIK_DOGRULANAMADI: "T.C. kimlik numarası doğrulanamadı."
  R22_BELGE_DOGRULAMA: "Belgelerinizden okunan bilgiler bir uzman tarafından doğrulanmalı."
  R23_ANOMALI: "Başvurunuz olağan dışı özellikler taşıdığı için ek incelemeye alındı."
  R24_BAKIYE_DUSUK: "Hesabınızdaki ortalama bakiye gelirinize göre düşük."
  R25_MEVCUT_BORC: "Mevcut kredi ve kart borçlarınızın limitlerinize oranı yüksek ({bureau_utilisation})."
  R26_KKB_DAVRANIS: "Kredi Kayıt Bürosu ödeme davranışınız (gecikme geçmişi ve limit kullanımı) yüksek risk göstergesi taşıyor."
  R27_DSR_SINIRDA: "Aylık borç ödemelerinizin gelirinize oranı ({dsr}) politika sınırı olan {max_dsr} seviyesine yakın."
feature_reasons:        # model feature -> olumsuz katkıda kullanılacak gerekçe kodu
  bureau_score: R02_KKB_DUSUK
  dsr: R01_DSR_YUKSEK
  delinquency_count_24m: R03_GECIKME_GECMISI
  max_dpd_24m: R03_GECIKME_GECMISI
  inquiries_6m: R04_SORGU_SAYISI
  employment_months: R05_ISTIHDAM_KISA
  income_cv: R06_GELIR_DEGISKEN
  negative_balance_days: R07_NEGATIF_BAKIYE
  gambling_share: R08_KUMAR_HARCAMA
  loan_to_income: R09_TUTAR_GELIR
  savings_rate: R17_TASARRUF_DUSUK
  nsf_count: R19_KARSILIKSIZ
  avg_balance_to_income: R24_BAKIYE_DUSUK
  bureau_utilisation: R25_MEVCUT_BORC
  active_loans: R25_MEVCUT_BORC
  bureau_behavior_score: R26_KKB_DAVRANIS

# Önemlilik: bir model gerekçesi ancak SHAP katkısı (log-odds) ve skor kartında kaybedilen
# puan eşiği aşıyorsa üretilir; toplamda en fazla max_codes kod gösterilir.
materiality:
  min_shap: 0.10
  min_points_lost: 5.0
  max_codes: 4

# Değere göre koşul: özellik değeri politika açısından gerçekten olumsuz aralıkta değilse
# (koşul yanlışsa) o özellikten gerekçe üretilmez. İfadeler güvenli değerlendiriciyle çalışır.
adverse_when:
  bureau_score: "bureau_score < 1400"
  delinquency_count_24m: "delinquency_count_24m >= 1"
  max_dpd_24m: "max_dpd_24m >= 30"
  inquiries_6m: "inquiries_6m >= 3"
  active_loans: "active_loans >= 3"
  bureau_utilisation: "bureau_utilisation >= 0.60"
  bureau_behavior_score: "bureau_behavior_score >= 0.15"
  dsr: "dsr > max_dsr * 0.8"
  loan_to_income: "loan_to_income >= 0.60"
  employment_months: "employment_months < 24"
  income_cv: "income_cv >= 0.10"
  negative_balance_days: "negative_balance_days >= 10"
  nsf_count: "nsf_count >= 1"
  gambling_share: "gambling_share >= 0.03"
  savings_rate: "savings_rate < 0.05"
  avg_balance_to_income: "avg_balance_to_income < 0.50"

# Onaylanan dosyalarda ret dili kullanılmaz: aynı koşullar "iyileştirme alanı" olarak anlatılır.
improvements:
  R01_DSR_YUKSEK: "İyileştirme alanı: aylık borç ödemelerinizin gelirinize oranı {dsr}; bu oranın düşmesi daha yüksek tutar ve daha iyi koşullar sağlayabilir."
  R02_KKB_DUSUK: "İyileştirme alanı: Kredi Kayıt Bürosu notunuzun ({bureau_score}) yükselmesi fiyatlamanızı iyileştirebilir."
  R03_GECIKME_GECMISI: "İyileştirme alanı: son 24 aydaki {delinquency_count_24m} gecikme kaydı; düzenli ödemeler risk değerlendirmenizi iyileştirir."
  R04_SORGU_SAYISI: "İyileştirme alanı: son 6 ayda {inquiries_6m} kredi sorgusu yapılmış; yeni başvuruları sınırlamak faydalı olabilir."
  R05_ISTIHDAM_KISA: "İyileştirme alanı: mevcut işyerinizdeki çalışma süreniz ({employment_months} ay) uzadıkça değerlendirme olumlu etkilenir."
  R06_GELIR_DEGISKEN: "İyileştirme alanı: aylık gelirinizin değişkenliği ({income_cv}) azaldıkça koşullarınız iyileşebilir."
  R07_NEGATIF_BAKIYE: "İyileştirme alanı: hesabınızın eksi bakiyede kaldığı gün sayısı ({negative_balance_days})."
  R08_KUMAR_HARCAMA: "İyileştirme alanı: şans oyunu/bahis harcamalarınızın payı ({gambling_share})."
  R09_TUTAR_GELIR: "İyileştirme alanı: talep tutarınız yıllık gelirinizin {loan_to_income} katı; daha düşük tutar daha iyi koşullar sağlayabilir."
  R17_TASARRUF_DUSUK: "İyileştirme alanı: aylık tasarruf oranınız ({savings_rate}) arttıkça değerlendirme olumlu etkilenir."
  R19_KARSILIKSIZ: "İyileştirme alanı: son 12 aydaki {nsf_count} karşılıksız/iade işlem kaydı."
  R20_INCE_DOSYA: "İyileştirme alanı: kredi geçmişiniz oluştukça değerlendirme hesap hareketlerinin yanında KKB verisine de dayanabilir."
  R24_BAKIYE_DUSUK: "İyileştirme alanı: hesabınızdaki ortalama bakiyenin gelirinize oranı yükseldikçe koşullarınız iyileşebilir."
  R25_MEVCUT_BORC: "İyileştirme alanı: mevcut kredi ve kart borçlarınızın limitlerinize oranı ({bureau_utilisation})."
  R27_DSR_SINIRDA: "İyileştirme alanı: aylık borç ödemelerinizin gelirinize oranı {dsr}; sınır olan {max_dsr} seviyesinden uzaklaştıkça koşullarınız iyileşebilir."
  R26_KKB_DAVRANIS: "İyileştirme alanı: KKB ödeme davranışınız (gecikme geçmişi ve limit kullanımı) iyileştikçe fiyatlamanız iyileşebilir."
