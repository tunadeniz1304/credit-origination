name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANIL2_NO_DOTENV: "1"
      LLM_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tesseract OCR (Turkish)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Per-area coverage floors
        run: python scripts/check_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANIL2_NO_DOTENV: "1"
      LLM_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: python -m pytest -m e2e -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
